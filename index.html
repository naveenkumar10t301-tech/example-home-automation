<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ESP32 Smart Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0f0f0f;color:#fff;text-align:center;}
h2{padding:15px;}
button{margin:10px;padding:10px 15px;border:none;border-radius:6px;cursor:pointer;font-size:16px;}
.on{background:#00c853;color:#fff;}
.off{background:#d50000;color:#fff;}

/* ===== FAN ANIMATION ===== */
.fan-wrap{width:60px;height:60px;margin:10px auto;position:relative;}
.fan{width:100%;height:100%;position:relative;transition: transform 0.2s linear;}
.fan-center{width:8px;height:8px;background:#fff;border-radius:50%;position:absolute;top:26px;left:26px;z-index:2;}
.blade{width:28px;height:6px;background:#ccc;position:absolute;top:27px;left:30px;border-radius:4px;transform-origin:0% 50%;}
.blade:nth-child(1){transform:rotate(0deg);}
.blade:nth-child(2){transform:rotate(120deg);}
.blade:nth-child(3){transform:rotate(240deg);}
.fan-on{animation:spin 1s linear infinite;}
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* LED indicator */
.led{width:16px;height:16px;border-radius:50%;background:#333;margin:15px auto;}
.led-on{background:#00ff9c;box-shadow:0 0 8px #00ff9c,0 0 18px #00ff9c;animation: ledBlink 1s infinite alternate;}
@keyframes ledBlink{from{opacity:0.5}to{opacity:1;}}

/* Plug indicator */
.plug{width:22px;height:38px;margin:12px auto;background:#444;border-radius:4px;position:relative;}
.plug::before,.plug::after{content:"";position:absolute;top:-6px;width:4px;height:6px;background:#555;}
.plug::before{left:5px;}
.plug::after{right:5px;}
.plug-on{background:#00e676;box-shadow:0 0 10px #00e676;animation: powerPulse 1s infinite;}
@keyframes powerPulse{0%{box-shadow:0 0 6px #00e676;}50%{box-shadow:0 0 16px #00e676;}100%{box-shadow:0 0 6px #00e676;}}
</style>
</head>
<body>

<h2>ESP32 Smart Device Control</h2>

<div>
<p>LED:</p>
<div class="led" id="ledIcon"></div>
<button id="ledBtn" class="off" onclick="toggle('led')">OFF</button>
</div>

<div>
<p>Fan:</p>
<div class="fan-wrap">
  <div class="fan" id="fanIcon">
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="blade"></div>
    <div class="fan-center"></div>
  </div>
</div>
<button id="fanBtn" class="off" onclick="toggle('fan')">OFF</button>
</div>

<div>
<p>Plug:</p>
<div class="plug" id="plugIcon"></div>
<button id="plugBtn" class="off" onclick="toggle('plug')">OFF</button>
</div>

<script>
const ESP32_IP = "YOUR_NGROK_OR_PUBLIC_IP"; // Replace with ngrok URL or public IP

function toggle(device){
    fetch(`http://${ESP32_IP}/control?device=${device}`).then(()=>updateState());
}

function updateState(){
    fetch(`http://${ESP32_IP}/state`)
    .then(response=>response.json())
    .then(data=>{
        // LED
        document.getElementById('ledBtn').textContent = data.led?'ON':'OFF';
        document.getElementById('ledBtn').className = data.led?'on':'off';
        document.getElementById('ledIcon').className = data.led?'led led-on':'led';

        // Fan
        document.getElementById('fanBtn').textContent = data.fan?'ON':'OFF';
        document.getElementById('fanBtn').className = data.fan?'on':'off';
        document.getElementById('fanIcon').className = data.fan?'fan fan-on':'fan';

        // Plug
        document.getElementById('plugBtn').textContent = data.plug?'ON':'OFF';
        document.getElementById('plugBtn').className = data.plug?'on':'off';
        document.getElementById('plugIcon').className = data.plug?'plug plug-on':'plug';
    });
}

setInterval(updateState, 1000);
window.onload = updateState;
</script>

</body>
</html>
